<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Mahalla | Admin panel</title>
    <link rel="stylesheet" href="css/main.css">
    <link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet" />
</head>

<body>
    <header>
        <h1>Admin Panel</h1>
    </header>

    <section id="login-section">
        <h2>Kirish</h2>
        <form id="login-form">
            <input type="text" id="username" placeholder="Name" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Kirish</button>
        </form>
        <p id="login-error" style="color:red;"></p>
    </section>

    <section id="admin-section" style="display:none;">
        <nav>
            <ul>
                <li><a href="index.html">Bosh sahifa</a></li>
                <li><a href="mahalla.html">Mahallalar</a></li>
                <li><a href="admin.html" class="active">Admin</a></li>
            </ul>
        </nav>

        <h2>Yangi mahalla qo‘shish</h2>
        <form id="add-form">
            <input type="text" id="mahalla" placeholder="Mahalla nomi" required>
            <input type="number" id="tank" placeholder="Tank (L)" required>
            <button type="submit">Qo‘shish</button>
        </form>

        <h2>Mahallalar ro‘yxati</h2>
        <ul id="mahalla-list"></ul>
    </section>

    <footer>
        <p>© 2025 Smart Mahalla</p>
    </footer>

    <script src="js/admin.js"></script>
    <script type="module">
        import { createChat } from 'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';

        createChat({
            webhookUrl: 'https://lizgooo.app.n8n.cloud/webhook/48c356be-58a4-43ef-9da1-44c9afebd58a/chat'
        });
    </script>
</body>

</html>
